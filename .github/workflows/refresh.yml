name: Refresh merchants
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-merchants.mjs
        env:
          KOKO_TOKEN: ${{ secrets.KOKO_TOKEN }}
      - run: node scripts/build-site.mjs
      - name: Commit if changed
        run: |
          git config user.name "merchant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/merchants.json index.html sitemap.xml stores locations how-koko-works
          git diff --cached --quiet || (git commit -m "Refresh merchants $(date -u +%F)" && git push)
